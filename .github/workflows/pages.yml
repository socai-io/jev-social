name: deploy pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/banner.png"
      - "docs/jev-social.gif"
      - "docs/platforms/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the static site
        run: |
          mkdir -p _site/assets/platforms
          cp site/index.html site/styles.css site/favicon.svg site/robots.txt site/sitemap.xml site/llms.txt site/a7d8dcce78db561a70661682fc57f53cd04f3b50f3bddb6bf62627d5024afb57.txt _site/
          cp docs/banner.png docs/jev-social.gif _site/assets/
          cp docs/platforms/instagram.png docs/platforms/tiktok.png docs/platforms/linkedin.svg _site/assets/platforms/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
