name: deploy pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/banner.png"
      - "docs/jev-social.gif"
      - "docs/platforms/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the static site
        run: |
          mkdir -p _site/assets/platforms
          cp site/index.html site/styles.css site/favicon.svg _site/
          cp docs/banner.png docs/jev-social.gif _site/assets/
          cp docs/platforms/instagram.png docs/platforms/tiktok.png docs/platforms/linkedin.svg _site/assets/platforms/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
