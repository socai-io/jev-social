name: deploy pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/banner.png"
      - "docs/social-preview.jpg"
      - "docs/jev-social.gif"
      - "docs/platforms/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the static site
        run: |
          mkdir -p _site/assets/platforms _site/local-system-one
          cp site/index.html site/styles.css site/favicon.svg site/robots.txt site/sitemap.xml site/llms.txt site/a7d8dcce78db561a70661682fc57f53cd04f3b50f3bddb6bf62627d5024afb57.txt _site/
          cp site/local-system-one/index.html _site/local-system-one/
          cp docs/banner.png docs/social-preview.jpg docs/jev-social.gif _site/assets/
          cp docs/platforms/instagram.png docs/platforms/tiktok.png docs/platforms/linkedin.svg _site/assets/platforms/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
